name: Fabriquer l'APK

# Se lance à chaque modification de l'appli, ou à la main depuis l'onglet Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Installer Capacitor
        run: npm install --no-audit --no-fund

      - name: Préparer les fichiers de l'appli
        run: |
          mkdir -p www/fonts
          for f in atkinson-hyperlegible/files/atkinson-hyperlegible-latin-400-normal.woff2 \
                   atkinson-hyperlegible/files/atkinson-hyperlegible-latin-700-normal.woff2 \
                   bricolage-grotesque/files/bricolage-grotesque-latin-600-normal.woff2 \
                   bricolage-grotesque/files/bricolage-grotesque-latin-800-normal.woff2; do
            cp "node_modules/@fontsource/$f" www/fonts/ || echo "::warning::Police absente : $f"
          done
          cp node_modules/@capacitor/core/dist/capacitor.js www/
          sed -i 's#<!--CAPACITOR-->#<script src="capacitor.js"></script>#' www/index.html

      - name: Créer le projet Android
        run: npx cap add android

      - name: Icône et écran de démarrage
        run: >
          npx --yes @capacitor/assets generate --android
          --iconBackgroundColor '#FFFFFF' --iconBackgroundColorDark '#FFFFFF'
          --splashBackgroundColor '#FFFFFF' --splashBackgroundColorDark '#FFFFFF'

      - name: Synchroniser
        run: npx cap sync android

      - name: Numéro de version
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Compiler l'APK signé
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/signing/dragonne-club.jks" \
            -Pandroid.injected.signing.store.password=DragonneClub2026 \
            -Pandroid.injected.signing.key.alias=dragonne \
            -Pandroid.injected.signing.key.password=DragonneClub2026
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/dragonne-club.apk"

      - name: Publier le lien de téléchargement
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.${{ github.run_number }}" dragonne-club.apk \
            --title "Dragonne Club – version 1.${{ github.run_number }}" \
            --notes "Ouvrir ce lien sur la tablette, télécharger dragonne-club.apk puis l'installer. Une nouvelle version s'installe par-dessus l'ancienne sans perdre les données." \
            --latest
